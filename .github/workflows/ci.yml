name: CI
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm test
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-argo:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-argo:latest
      - name: Update Helm chart
        env:
          TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}helm-charts.git
          cd helm-charts
          sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" chart/lab-argo/values.yaml
          sed -i "s/^version:.*/version: ${VERSION}/" chart/lab-argo/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/lab-argo/Chart.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "lab-argo ${VERSION}"
          git push
